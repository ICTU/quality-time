[project]
name = "tools"
version = "5.60.1"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3.16",
]
dependencies = [
    "archunitpython==1.8.1",
    "bandit==1.9.4",
    "codespell==2.4.3",
    "coverage==7.16.2",
    "fixit==2.2.1",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pyproject-fmt==2.30.3",
    "ruff==0.17.0",
    "troml==0.4.1",
    "ty==0.0.87",
    "unittest-xml-reporting==4.0.0", # Needed to generate JUnit XML output for Sonarcloud.io
    "vulture==2.16",
]

[dependency-groups]
just = [
    "rust-just==1.58.0",
]
# Tools that are run on the repository as a whole, instead of per component, are in a group so that they are not
# installed in the components' environments, where their dependencies would needlessly constrain the resolution.
project-wide = [
    "compose-lint==0.36.0",
    "yamllint==1.38.0",
    "zizmor==1.31.0",       # Static analysis tool for GitHub Actions
]
# Update-time is only run on the repository as a whole, and pins its dependencies, so it also gets its own group.
update-time = [
    "update-time==0.0.45",
]
uv = [
    "uv==0.13.5",
]

[tool.uv]
override-dependencies = [
    "click==8.3.3" # PYSEC-2026-2132 (CVE-2026-7246); fixit pins click<8.2, see https://github.com/Instagram/Fixit/issues/570
]
exclude-newer = "7 days"
exclude-newer-package = { certifi = false, uv = false }  # GHSA-6q48-6c7w-9gw2 (certifi) and GHSA-hq85-5cpj-mr62 (uv) both concern trusting compromised emSign intermediate CAs; the fixes in certifi 2026.10.19 and uv 0.13.4, released 2026-10-20, would be blocked by exclude-newer; remove after 2026-10-27
package = false

[tool.ruff]
line-length = 120
src = [
    "src",
]
lint.select = [
    "ALL",
]
lint.ignore = [
    "COM812", # https://docs.astral.sh/ruff/rules/missing-trailing-comma/ - this rule may cause conflicts when used with the ruff formatter
    "CPY001", # https://docs.astral.sh/ruff/rules/missing-copyright-notice/ - not sure of the value of repeating the notice in every file
    "D203",   # https://docs.astral.sh/ruff/rules/one-blank-line-before-class/ - prevent warning: `one-blank-line-before-class` (D203) and `no-blank-line-before-class` (D211) are incompatible. Ignoring `one-blank-line-before-class`
    "D213",   # https://docs.astral.sh/ruff/rules/multi-line-summary-second-line/ - prevent warning: `multi-line-summary-first-line` (D212) and `multi-line-summary-second-line` (D213) are incompatible. Ignoring `multi-line-summary-second-line`
    "ISC001", # https://docs.astral.sh/ruff/rules/single-line-implicit-string-concatenation/ - this rule may cause conflicts when used with the ruff formatter
    "TC006",  # https://docs.astral.sh/ruff/rules/runtime-cast-value/ - the rule claims it's often necessary to quote the first argument passed to cast(), but that's not the case in this code base
]
lint.per-file-ignores.".vulture-whitelist.py" = [
    "ALL",
]

[tool.pyproject-fmt]
indent = 4
keep_full_version = true  # Don't remove trailing zero's from version specifiers
