---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  - package-ecosystem: uv
    directory: "/tools/third_party"
    allow:
      - dependency-type: "direct"
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  - package-ecosystem: uv
    directory: "/components/collector"
    allow:
      - dependency-type: "direct"
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directories:
      - "/components"
      - "/components/database"
      - "/components/frontend"
      - "/components/proxy"
      - "/components/renderer"
      - "/components/testdata"
      - "/components/testldap"
    cooldown:
      default-days: 7
    ignore:
      # Dependabot does not recognize PEP 440 pre-release tags such as 3.15.0b4 as pre-releases,
      # see https://github.com/dependabot/dependabot-core/issues/13809. Bump Python minor and major
      # versions manually; patch updates are still proposed by Dependabot.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: "/components/frontend"
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  - package-ecosystem: uv
    directory: "/components/notifier"
    allow:
      - dependency-type: "direct"
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: "/components/renderer"
    allow:
      - dependency-type: "direct"
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  - package-ecosystem: uv
    directory: "/components/api_server"
    allow:
      - dependency-type: "direct"
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  - package-ecosystem: uv
    directory: "/components/shared_code"
    allow:
      - dependency-type: "direct"
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: "/docs"
    allow:
      - dependency-type: "direct"
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  - package-ecosystem: uv
    directory: "/docs"
    allow:
      - dependency-type: "direct"
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  - package-ecosystem: uv
    directory: "/tools/release"
    allow:
      - dependency-type: "direct"
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  - package-ecosystem: uv
    directory: "/tests/application_tests"
    allow:
      - dependency-type: "direct"
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  - package-ecosystem: uv
    directory: "/tests/feature_tests"
    allow:
      - dependency-type: "direct"
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
