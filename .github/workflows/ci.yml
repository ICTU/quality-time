---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions: {}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: components/collector
            name: components-collector
            language: python
          - folder: components/notifier
            name: components-notifier
            language: python
          - folder: components/api_server
            name: components-api_server
            language: python
          - folder: components/shared_code
            name: components-shared_code
            language: python
          - folder: components/frontend
            name: components-frontend
            language: js
          - folder: components/renderer
            name: components-renderer
            language: js
          - folder: tools/just
            name: tools-just
            language: python
          - folder: tools/release
            name: tools-release
            language: python
          - folder: tools/third_party
            name: tools-third_party
            language: python
          - folder: tests/application_tests
            name: tests-application_tests
            language: python
          - folder: tests/feature_tests
            name: tests-feature_tests
            language: python
          - folder: tests/shared_test_code
            name: tests-shared_test_code
            language: python
          - folder: .
            name: root
            language: misc
    steps:
      - name: Login to DockerHub
        if: env.SONAR_TOKEN != null
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          version-file: tools/third_party/pyproject.toml
      - name: Setup Node.js
        if: matrix.language == 'js'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ matrix.folder }}/package.json
      - name: Run tests and quality checks
        run: uv tool run --directory ${{ matrix.folder }} --from $(uv export --project tools/third_party --only-group just --quiet --no-hashes --no-header) just ci # yamllint disable-line rule:line-length
      - name: Upload build artifacts
        if: env.SONAR_TOKEN != null
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-${{ matrix.name }}
          path: ${{ matrix.folder }}/build
          if-no-files-found: ignore
          retention-days: 1

  scan:
    needs: test
    runs-on: ubuntu-latest
    permissions: {}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SONAR_TOKEN != null
        with:
          fetch-depth: 0 # Disabling shallow clone is recommended for improving relevancy of reporting
          persist-credentials: false
      - name: Download build artifacts
        if: env.SONAR_TOKEN != null
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: sonar-*
      - name: Restore artifacts to component build directories
        if: env.SONAR_TOKEN != null
        # yamllint disable rule:line-length
        run: |
          for dir in components/api_server components/collector components/notifier components/shared_code components/frontend components/renderer tools/just tools/release; do
            mkdir -p $dir/build
            cp -r artifacts/sonar-${dir//\//-}/. $dir/build/
          done
        # yamllint enable rule:line-length
      - name: Create packages
        if: env.SONAR_TOKEN != null
        # yamllint disable rule:line-length
        run: |
          touch components/__init__.py
          touch tools/__init__.py
          for dir in components/api_server components/collector components/notifier components/shared_code tools/just tools/release; do
            touch $dir/__init__.py
            touch $dir/src/__init__.py
            sed --in-place "s#name=\"\([^\"]*\)\" filename=\"\([^\"]*\)\"#name=\"$GITHUB_WORKSPACE/$dir/\2\" filename=\"$GITHUB_WORKSPACE/$dir/\2\"#g" $dir/build/unittest-coverage.xml
            sed --in-place "s#file=\"#file=\"$GITHUB_WORKSPACE/$dir/#g" $dir/build/unittests.xml
            sed --in-place "s#classname=\"#classname=\"${dir//\//-}.#g" $dir/build/unittests.xml
          done
        # yamllint enable rule:line-length
      - name: Sonarcloud scan
        if: env.SONAR_TOKEN != null
        uses: sonarsource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
