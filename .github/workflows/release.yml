---
name: Release

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - "v*"

jobs:
  containers:
    name: Push container images to Docker Hub
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      matrix:
        include:
          - component: api_server
            context:
            file: components/python.Dockerfile
          - component: collector
            context:
            file: components/python.Dockerfile
          - component: database
            context: components/database
            file:
          - component: frontend
            context: components/frontend
            file:
          - component: notifier
            context:
            file: components/python.Dockerfile
          - component: proxy
            context: components/proxy
            file:
          - component: renderer
            context: components/renderer
            file:
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push ${{ matrix.component }} to Docker Hub
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: COMPONENT=${{ matrix.component }}
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          tags: ictu/quality-time_${{ matrix.component }}:${{ github.ref_name }}
          sbom: true
          push: true
          provenance: mode=max
  finalize:
    name: Finalize release
    needs: containers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push Helm chart to Docker Hub
        working-directory: helm
        run: |
          helm package .
          helm push quality-time-*.tgz oci://registry-1.docker.io/ictu
      - name: Generate changes for this release
        run: tools/release/src/latest_release_changelog.py docs/src/changelog.md > ${{ github.workspace }}-CHANGELOG.txt
      - name: Create GitHub release # zizmor: ignore[superfluous-actions]
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          body_path: ${{ github.workspace }}-CHANGELOG.txt
