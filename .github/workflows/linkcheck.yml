---
name: Documentation linkcheck

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version-file: tools/third_party/pyproject.toml
      - name: Run sphinx linkcheck
        run: uv tool run --directory docs --from $(uv export --project tools/third_party --only-group just --quiet --no-hashes --no-header) just linkcheck # yamllint disable-line rule:line-length
